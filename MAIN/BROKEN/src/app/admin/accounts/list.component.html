<h1>Accounts</h1>
<p>All accounts from secure (admin only) api end point. Accounts created here DO NOT need to be email authenticated.</p>
<a routerLink="add" mat-raised-button color="primary" class="mb-3">Create Account</a>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">
        <!-- Image Column -->
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef class="image-column">Photo</th>
            <td mat-cell *matCellDef="let account" class="image-column">
                <img [src]="account.profileImage || defaultImage"
                     [alt]="account.firstName"
                     class="profile-image"
                     matTooltip="Profile photo of {{account.firstName}} {{account.lastName}}"
                     (error)="onImageError($event)">
            </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let account">
                {{account.title}} {{account.firstName}} {{account.lastName}}
            </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let account">{{account.email}}</td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let account">{{account.role}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
            <td mat-cell *matCellDef="let account" class="actions-column">
                <div class="action-buttons">
                    <button mat-icon-button color="primary" 
                            [routerLink]="['edit', account.id]"
                            matTooltip="Edit account">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn"
                            (click)="onDelete(account.id, account.firstName, account.lastName)"
                            [disabled]="account.isDeleting"
                            matTooltip="Delete account">
                        <span *ngIf="account.isDeleting" class="spinner-border spinner-border-sm"></span>
                        <span *ngIf="!account.isDeleting"><mat-icon>delete</mat-icon></span>
                    </button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Loading row -->
        <tr *ngIf="!dataSource.data.length" class="mat-row">
            <td class="mat-cell" colspan="5">
                <div class="loading-container">
                    <mat-spinner diameter="40"></mat-spinner>
                </div>
            </td>
        </tr>

        <!-- No data row -->
        <tr *ngIf="dataSource.data.length === 0" class="mat-row">
            <td class="mat-cell" colspan="5">
                <div class="no-data-container">
                    No accounts found
                </div>
            </td>
        </tr>
    </table>
</div>
