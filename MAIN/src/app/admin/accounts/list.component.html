<!-- Accounts List -->
<h1>Accounts</h1>
<p>All accounts from secure (admin only) api end point. Accounts created here DO NOT need to be email authenticated.</p>
<button mat-raised-button color="primary" routerLink="add" class="mb-3">Create Account</button>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="accounts" class="accounts-table">
        <!-- Image Column -->
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef class="image-column"> Photo </th>
            <td mat-cell *matCellDef="let account" class="image-column">
                <img *ngIf="account.profileImage" [src]="account.profileImage" class="profile-image" 
                     [matTooltip]="account.firstName + ' ' + account.lastName">
                <mat-icon *ngIf="!account.profileImage" class="no-image">account_circle</mat-icon>
            </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let account"> {{account.title}} {{account.firstName}} {{account.lastName}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let account"> {{account.email}} </td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Role </th>
            <td mat-cell *matCellDef="let account"> {{account.role}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-column"> Actions </th>
            <td mat-cell *matCellDef="let account" class="actions-column">
                <button mat-icon-button color="primary" [routerLink]="['edit', account.id]" matTooltip="Edit Account">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteAccount(account.id)" 
                        [disabled]="account.isDeleting" matTooltip="Delete Account">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
