<h1>Accounts</h1>
<p>All accounts from secure (admin only) api end point. Accounts created here DO NOT need to be email authenticated.</p>
<button mat-raised-button color="primary" routerLink="add" class="mb-3">Create Account</button>

<div *ngIf="error" class="alert alert-danger">{{error}}</div>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="accounts" class="accounts-table">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let account">
                {{account.title}} {{account.firstName}} {{account.lastName}}
            </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let account">{{account.email}}</td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let account">{{account.role}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
            <td mat-cell *matCellDef="let account" class="actions-column">
                <button mat-icon-button color="primary" 
                        [routerLink]="['edit', account.id]">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" 
                        (click)="onDelete(account.id, account.firstName, account.lastName)"
                        [disabled]="account.isDeleting">
                    <mat-icon *ngIf="!account.isDeleting">delete</mat-icon>
                    <mat-progress-spinner *ngIf="account.isDeleting" 
                                       [diameter]="20"
                                       mode="indeterminate"
                                       class="spinner-center">
                    </mat-progress-spinner>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Loading Row -->
        <tr *matNoDataRow>
            <td class="mat-cell" colspan="4">
                <mat-progress-spinner *ngIf="!accounts" 
                                   [diameter]="40"
                                   mode="indeterminate"
                                   class="spinner-center">
                </mat-progress-spinner>
                <div *ngIf="accounts.data.length === 0">No accounts found</div>
            </td>
        </tr>
    </table>
</div>
