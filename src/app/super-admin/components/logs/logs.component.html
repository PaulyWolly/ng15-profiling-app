<div class="container-fluid px-4 pb-4">
    <!-- Top-level Log Type Selector -->
    <div class="mb-3 d-flex align-items-center gap-3 justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <label class="fw-bold me-2">Log Type:</label>
            <button *ngFor="let t of logTypes" class="btn btn-outline-primary me-2" [class.active]="selectedLogType === t"
                (click)="selectLogType(t)">{{t}}</button>
        </div>
        <div class="d-flex align-items-center">
            <span *ngIf="loading" class="me-3">
                <i class="fas fa-spinner fa-spin me-2"></i>Gathering log data...
            </span>
            <button class="btn btn-outline-primary me-2" (click)="refresh()" title="Refresh Logs">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <div class="form-check form-switch me-3" *ngIf="selectedLogType === 'Error'">
                <input class="form-check-input" type="checkbox" id="autoRefreshSwitch"
                       [checked]="autoRefresh" (change)="toggleAutoRefresh()">
                <label class="form-check-label" for="autoRefreshSwitch">Auto-refresh</label>
            </div>
            <button
              *ngIf="selectedNodes && selectedNodes.length > 0"
              class="btn btn-danger"
              (click)="confirmDeleteSelected()"
            >
              <i class="fas fa-trash-alt me-1"></i> Delete Selected
            </button>
        </div>
    </div>

    <!-- Mock Data Alert -->
    <div *ngIf="showingMockData" class="alert alert-warning mb-3">
        <strong><i class="fas fa-exclamation-triangle me-2"></i> Mock Data:</strong>
        You are currently viewing mock log data for demonstration purposes. These logs do not represent actual system events.
    </div>

    <!-- Log Explorer (PrimeNG Tree) -->
    <div class="card">
        <div class="card-body log-tree-container" style="max-height: 600px; overflow-y: auto;">
            <p-tree
              [value]="treeData"
              selectionMode="checkbox"
              [(selection)]="selectedNodes"
              [propagateSelectionUp]="true"
              [propagateSelectionDown]="true"
              [style]="{width:'100%'}"
            >
              <ng-template let-node pTemplate="default">
                <span *ngIf="node.data" (click)="openLogDetailsDialog(node.data); $event.stopPropagation();" class="log-entry-label" style="cursor:pointer;">
                  {{node.label}}
                </span>
                <span *ngIf="!node.data">
                  {{node.label}}
                </span>
              </ng-template>
            </p-tree>
        </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && (!treeData || treeData.length === 0)" class="card mt-3">
        <div class="card-body text-center">
            <p class="text-muted">No {{selectedLogType}} logs found</p>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="card mt-3">
        <div class="card-body text-center">
            <i class="fas fa-spinner fa-spin me-2"></i> Loading logs...
        </div>
    </div>
</div>
