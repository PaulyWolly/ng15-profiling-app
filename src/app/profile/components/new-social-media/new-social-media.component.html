<div class="social-media-profile">
    <div class="profile-header">
        <div class="profile-image-container" [class.loading]="imageLoading">
            <img *ngIf="profile?.profileImage" 
                [src]="profile.profileImage" 
                alt="Profile picture"
                class="img-fluid rounded-circle profile-img mb-3"
                style="max-width: 120px;"
                (load)="onImageLoaded()"
                (error)="onImageError()">
            <div *ngIf="!profile?.profileImage && !imageLoading" class="default-avatar mb-3">
                <mat-icon class="large-icon">account_circle</mat-icon>
            </div>
            <div *ngIf="imageLoading" class="loading-spinner">
                <mat-spinner diameter="40"></mat-spinner>
            </div>
        </div>

        <!-- Image upload controls - only shown when viewing own profile -->
        <div *ngIf="isOwnProfile" class="image-upload-controls mb-3">
            <input type="file" 
                   accept="image/*" 
                   (change)="onFileSelected($event)" 
                   style="display: none" 
                   #fileInput>
            <button type="button" mat-stroked-button color="primary" (click)="fileInput.click()" class="upload-btn">
                <mat-icon>cloud_upload</mat-icon>
                Change Photo
            </button>
            <button *ngIf="selectedFile" type="button" mat-stroked-button color="primary" (click)="uploadImage()" class="save-btn">
                <mat-icon>save</mat-icon>
                Save
            </button>
            <div *ngIf="selectedFile" class="preview-container mt-2">
                <img [src]="previewUrl" alt="Preview" class="preview-image">
            </div>
        </div>

        <div class="profile-info">
            <h1>{{profile.firstName}} {{profile.lastName}}</h1>
            <p class="title">{{profile.position || 'Professional Title'}}</p>
            <p class="location" *ngIf="profile.city || profile.state">
                <mat-icon>location_on</mat-icon>
                {{profile.city}}{{profile.city && profile.state ? ', ' : ''}}{{profile.state}}
            </p>
        </div>
    </div>

    <div *ngIf="isOwnProfile" class="edit-profile-btn-container" style="margin-top: 16px; text-align: right;">
        <button mat-stroked-button color="primary" [routerLink]="['/profile/edit']">
            <mat-icon>edit</mat-icon> Edit Profile
        </button>
    </div>
</div>
