<div class="social-layout">
  <div class="cover-photo">
    <div class="profile-header">
      <div class="profile-image">
        <img [src]="profile.imageUrl" [alt]="profile.name">
      </div>
      <div class="profile-info">
        <h1>{{profile.name}}</h1>
        <h2>{{profile.title}}</h2>
        <div class="location">
          <mat-icon>location_on</mat-icon>
          <span>{{profile.location}}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="social-content">
    <div class="sidebar">
      <div class="about-section">
        <h3>About</h3>
        <div class="contact-info">
          <div class="contact-item">
            <mat-icon>phone</mat-icon>
            <span>{{profile.phone}}</span>
          </div>
          <div class="contact-item">
            <mat-icon>email</mat-icon>
            <span>{{profile.email}}</span>
          </div>
          <div class="contact-item">
            <mat-icon>language</mat-icon>
            <span>{{profile.website}}</span>
          </div>
        </div>
      </div>

      <div class="skills-section">
        <h3>Skills & Expertise</h3>
        <div class="skills-list">
          <span class="skill-badge" *ngFor="let skill of profile.skills">
            {{skill}}
          </span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="timeline">
        <div class="post-box">
          <div class="post-input">
            <img [src]="profile.imageUrl" [alt]="profile.name" class="user-avatar">
            <div class="input-placeholder">
              What's on your mind?
            </div>
          </div>
          <div class="post-actions">
            <button class="action-btn">
              <mat-icon>photo_camera</mat-icon>
              Photo
            </button>
            <button class="action-btn">
              <mat-icon>videocam</mat-icon>
              Video
            </button>
            <button class="action-btn">
              <mat-icon>event</mat-icon>
              Event
            </button>
          </div>
        </div>

        <div class="timeline-feed">
          <div class="post-card" *ngFor="let activity of profile.timeline">
            <div class="post-header">
              <img [src]="activity.authorImage" [alt]="activity.author" class="user-avatar">
              <div class="post-meta">
                <h4>{{activity.author}}</h4>
                <span class="post-time">{{activity.date}}</span>
              </div>
            </div>
            <div class="post-content">
              {{activity.content}}
            </div>
            <div class="post-actions">
              <button class="action-btn">
                <mat-icon>thumb_up</mat-icon>
                Like
              </button>
              <button class="action-btn">
                <mat-icon>comment</mat-icon>
                Comment
              </button>
              <button class="action-btn">
                <mat-icon>share</mat-icon>
                Share
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
