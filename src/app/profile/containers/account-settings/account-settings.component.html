<h1>Account Settings</h1>
<p class="lead mb-4">Update your password and account information</p>

<div class="container">
  <app-edit-content
    [editMode]="editMode"
    [isAddMode]="isAddMode"
    [initialData]="account"
    [submitting]="submitting"
    [loading]="loading"
    [submitted]="submitted"
    (save)="onSave($event)"
    (cancel)="onCancel()"
    (imageChange)="onImageChange($event)"
    (imageRemove)="onImageRemove()">
  </app-edit-content>
</div>
