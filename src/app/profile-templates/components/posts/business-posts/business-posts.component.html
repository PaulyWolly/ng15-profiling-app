<div class="posts-container">
  <div class="posts-list">
    <mat-card *ngFor="let post of posts" class="post-card">
      <mat-card-header>
        <img mat-card-avatar [src]="post.author.avatar" [alt]="post.author.name" class="author-avatar">
        <mat-card-title>{{ post.author.name }}</mat-card-title>
        <mat-card-subtitle>
          {{ post.author.title }}
          <span class="post-time">{{ getTimeAgo(post.createdAt) }}</span>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <h3 class="post-title" *ngIf="post.title">{{ post.title }}</h3>
        <p class="post-content">{{ post.content }}</p>
        <img *ngIf="post.imageUrl" [src]="post.imageUrl" [alt]="post.title" class="post-image">
      </mat-card-content>

      <mat-card-actions>
        <button mat-button (click)="onLike(post)">
          <mat-icon>thumb_up</mat-icon>
          <span>{{ post.likes }}</span>
        </button>
        <button mat-button (click)="onComment(post)">
          <mat-icon>comment</mat-icon>
          <span>{{ post.comments }}</span>
        </button>
        <button mat-button (click)="onShare(post)">
          <mat-icon>share</mat-icon>
          <span>{{ post.shares }}</span>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
