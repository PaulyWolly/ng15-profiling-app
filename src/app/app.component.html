<!-- Main application container -->
<div class="app-container">
    <!-- Header with navigation -->
    <nav class="navbar navbar-expand navbar-dark bg-dark px-3" *ngIf="account">
        <!-- <a class="navbar-brand" href="#">Angular App</a> -->
        <div class="navbar-nav">
            <a class="nav-item nav-link" [routerLink]="['/']" [class.active]="isActiveRoute('/')">Home</a>
            <a class="nav-item nav-link clickable" (click)="navigateTo('/profile')" [class.active]="isActiveRoute('/profile')">Profile</a>
            <a class="nav-item nav-link clickable" (click)="navigateTo('/admin')" [class.active]="isActiveRoute('/admin')" *ngIf="account?.role === Role.Admin">Admin</a>
            <!-- Admin users should have direct access to accounts management -->
            <a class="nav-item nav-link clickable" (click)="navigateTo('/admin/accounts')" [class.active]="isActiveRoute('/admin/accounts')" *ngIf="account?.role === Role.Admin">Accounts</a>
        </div>
        <div class="navbar-nav ms-auto">
            <span class="nav-item nav-link user-info">Logged in as <span class="user-name">{{account.firstName}} {{account.lastName}}</span></span>
            <button (click)="logout()" class="btn btn-link nav-item nav-link">Logout</button>
        </div>
    </nav>

    <!-- Subnav router outlet - only show for admin users when in admin section -->
    <router-outlet name="subnav" *ngIf="account?.role === Role.Admin && isActiveRoute('/admin')"></router-outlet>

    <!-- Main content area -->
    <div class="main-content-wrapper">
        <!-- global alert -->
        <alert></alert>
        <router-outlet></router-outlet>
    </div>

    <!-- Fixed footer -->
    <app-footer class="app-footer"></app-footer>
</div>
