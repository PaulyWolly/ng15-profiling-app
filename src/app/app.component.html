<!-- Main application container -->
<div class="app-container" [ngClass]="{ 'bg-light': account && account.role === Role.Admin }">
    <!-- Header with navigation -->
    <app-new-menu-bar [account]="account"></app-new-menu-bar>

    <!-- Subnav router outlet - only show for admin users when in admin section -->
    <router-outlet name="subnav" *ngIf="(account?.role === Role.Admin || account?.role === Role.SuperAdmin) && isActiveRoute('/admin')"></router-outlet>

    <!-- Main content area -->
    <div class="main-content-wrapper">
        <!-- global alert -->
        <alert></alert>
        <router-outlet></router-outlet>
    </div>
    
    <!-- Footer component -->
    <app-footer class="app-footer"></app-footer>

</div>
